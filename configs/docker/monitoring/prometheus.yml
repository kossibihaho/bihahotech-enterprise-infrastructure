global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files: []

scrape_configs:
  # Prometheus se supervise lui-même
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # MONITOR01 lui-même (via node-exporter en conteneur)
  - job_name: "monitor01"
    static_configs:
      - targets: ["node-exporter:9100"]

  # SRV-LINUX01 (nécessite node-exporter installé sur cette machine)
  - job_name: "srv-linux01"
    static_configs:
      - targets: ["192.168.10.20:9100"]

  # DC01 (nécessite windows_exporter installé)
  - job_name: "dc01"
    static_configs:
      - targets: ["192.168.10.10:9182"]

